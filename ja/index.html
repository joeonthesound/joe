<style>
/* ============================================================
   TOKENS — tema claro (predeterminado) y oscuro
   ============================================================ */
:root{
  --bg:#FBF8F1;
  --surface:#FFFFFF;
  --surface-2:#F4EFE4;
  --ink:#191510;
  --ink-soft:#4C463B;
  --muted:#7C7466;
  --line:#E6DECD;
  --line-strong:#D6C9AE;
  --copper:#A86B24;
  --copper-deep:#8A5417;
  --gold:#C39132;
  --gold-soft:rgba(195,145,50,.12);
  --ok:#3E7C4F;
  --danger:#A3402F;
  --shadow:0 1px 2px rgba(25,21,16,.05),0 12px 32px -16px rgba(25,21,16,.18);
  --shadow-sm:0 1px 2px rgba(25,21,16,.06);
  --radius:14px;
  --radius-sm:9px;
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
  --header-h:64px;
}
[data-theme="dark"]{
  --bg:#15110B;
  --surface:#1E1912;
  --surface-2:#251F16;
  --ink:#F3ECDD;
  --ink-soft:#CCC2AE;
  --muted:#998F7C;
  --line:#332B1E;
  --line-strong:#4A3E2A;
  --copper:#D69A4C;
  --copper-deep:#E3AE63;
  --gold:#D7A648;
  --gold-soft:rgba(215,166,72,.14);
  --ok:#7CB98B;
  --danger:#D97A66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -16px rgba(0,0,0,.55);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}
img{max-width:100%;height:auto;display:block}
a{color:var(--copper);text-decoration:none}
a:hover{color:var(--copper-deep)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:4px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.container{max-width:1120px;margin:0 auto;padding:0 24px}
@media(max-width:640px){.container{padding:0 18px}}

h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.12;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem)}
h3{font-size:1.18rem;line-height:1.3}

/* eyebrow / etiqueta de sección */
.eyebrow{
  display:flex;align-items:center;gap:12px;
  font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--copper);margin-bottom:14px;
}
.eyebrow::after{content:"";flex:0 0 44px;height:1px;background:var(--line-strong)}
.section{padding:72px 0}
.section + .section{border-top:1px solid var(--line)}
.section-head{max-width:680px;margin-bottom:36px}
.section-head p.lead{color:var(--ink-soft);margin-top:12px;font-size:1.05rem}

/* ============================================================
   HEADER / NAV
   ============================================================ */
.site-header{
  position:fixed;inset:0 0 auto 0;z-index:60;height:var(--header-h);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:100%}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:600}
.brand:hover{color:var(--ink)}
.brand .seal{
  width:34px;height:34px;border:1px solid var(--copper);border-radius:50%;
  display:grid;place-items:center;font-family:var(--font-display);
  font-size:.82rem;color:var(--copper);letter-spacing:.02em;flex:0 0 auto;
}
.brand .brand-name{font-size:.92rem;letter-spacing:.01em}
.brand .brand-sub{display:block;font-size:.66rem;font-weight:500;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.main-nav ul{display:flex;gap:4px;list-style:none}
.main-nav a{
  display:block;padding:8px 13px;border-radius:999px;
  font-size:.86rem;font-weight:500;color:var(--ink-soft);
  transition:color .2s,background .2s;
}
.main-nav a:hover{color:var(--ink);background:var(--gold-soft)}
.main-nav a[aria-current="page"]{color:var(--copper-deep);background:var(--gold-soft);font-weight:600}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-soft);display:grid;place-items:center;
  font-size:.85rem;transition:border-color .2s,color .2s;
}
.icon-btn:hover{border-color:var(--copper);color:var(--copper)}
.lang-btn{width:auto;padding:0 13px;font-weight:600;font-size:.78rem;letter-spacing:.06em}
.menu-btn{display:none}

.lang-select{
  width:auto;
  min-width:72px;
  padding:0 10px;
  appearance:auto;
  border-radius:999px;
  font-weight:700;
}
html[dir="rtl"] body{text-align:right}
html[dir="rtl"] .header-inner,
html[dir="rtl"] .footer-inner,
html[dir="rtl"] .hero-cta,
html[dir="rtl"] .badges,
html[dir="rtl"] .pill-cloud,
html[dir="rtl"] .chiprow{direction:rtl}
html[dir="rtl"] .eyebrow::after{margin-inline-start:0}
html[dir="rtl"] .tick-list li{padding-left:0;padding-right:26px}
html[dir="rtl"] .tick-list li::before{left:auto;right:0}
html[dir="rtl"] .value-block{border-left:0;border-right:3px solid var(--copper);border-radius:var(--radius) 0 0 var(--radius)}

@media(max-width:880px){
  .main-nav{
    position:fixed;top:var(--header-h);left:0;right:0;
    background:var(--bg);border-bottom:1px solid var(--line);
    padding:14px 18px 22px;transform:translateY(-12px);opacity:0;visibility:hidden;
    transition:transform .25s ease,opacity .25s ease,visibility .25s;
    box-shadow:var(--shadow);
  }
  .main-nav.open{transform:translateY(0);opacity:1;visibility:visible}
  .main-nav ul{flex-direction:column;gap:2px}
  .main-nav a{padding:12px 14px;font-size:1rem;border-radius:var(--radius-sm)}
  .menu-btn{display:grid}
}

/* ============================================================
   BOTONES
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 24px;border-radius:999px;font-weight:600;font-size:.92rem;
  border:1px solid transparent;transition:transform .18s ease,box-shadow .18s ease,background .2s,color .2s,border-color .2s;
  text-align:center;line-height:1.2;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:var(--copper-deep);border-color:var(--copper-deep);color:#FFF8EC;box-shadow:var(--shadow)}
.btn-copper{background:var(--copper);color:#FFF8EC;border-color:var(--copper)}
.btn-copper:hover{background:var(--copper-deep);border-color:var(--copper-deep);color:#FFF8EC}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-outline:hover{border-color:var(--copper);color:var(--copper-deep);background:var(--gold-soft)}
.btn-ghost{background:transparent;color:var(--copper-deep);border-color:transparent;padding-left:10px;padding-right:10px}
.btn-ghost:hover{background:var(--gold-soft)}
.btn-sm{padding:9px 16px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:calc(var(--header-h) + 64px) 0 76px;position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;top:-220px;right:-180px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,var(--gold-soft) 0%,transparent 68%);pointer-events:none;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:9px;
  font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--copper);
  margin-bottom:22px;
}
.hero-kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.hero h1{max-width:18ch}
.hero .hero-title{
  margin-top:22px;font-family:var(--font-display);font-weight:500;
  font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:1.35;color:var(--ink);
  max-width:30ch;
}
.hero .hero-title em{font-style:italic;color:var(--copper-deep)}
.hero .hero-sub{margin-top:16px;max-width:62ch;color:var(--ink-soft);font-size:1.02rem}
.badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:.8rem;font-weight:500;color:var(--ink-soft);
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold)}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:32px}
.hero-rule{margin-top:56px;display:flex;align-items:center;gap:16px;color:var(--muted);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.hero-rule::before,.hero-rule::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============================================================
   TARJETAS / GRIDS
   ============================================================ */
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;box-shadow:var(--shadow-sm);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  display:flex;flex-direction:column;gap:12px;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.card .card-index{font-family:var(--font-display);font-size:.85rem;color:var(--gold);letter-spacing:.04em}
.card h3{color:var(--ink)}
.card p{color:var(--ink-soft);font-size:.93rem}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:6px}
.chip{
  font-size:.72rem;font-weight:500;padding:4px 11px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);
}

/* bloque de valor (cita destacada) */
.value-block{
  margin-top:34px;padding:30px 34px;border-left:3px solid var(--copper);
  background:var(--surface);border-radius:0 var(--radius) var(--radius) 0;
  font-family:var(--font-display);font-size:clamp(1.08rem,2vw,1.3rem);
  line-height:1.5;color:var(--ink);box-shadow:var(--shadow-sm);max-width:760px;
}
.profile-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:44px;align-items:start}
@media(max-width:880px){.profile-cols{grid-template-columns:1fr}}
.profile-text p+p{margin-top:14px}
.profile-text p{color:var(--ink-soft)}
.profile-text strong{color:var(--ink)}
.fact-list{list-style:none;display:flex;flex-direction:column}
.fact-list li{
  display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  padding:13px 0;border-bottom:1px solid var(--line);font-size:.9rem;
}
.fact-list .k{color:var(--muted);flex:0 0 auto}
.fact-list .v{color:var(--ink);font-weight:500;text-align:right}

/* listas con marcador cobre */
.tick-list{list-style:none;display:grid;gap:10px}
.tick-list li{position:relative;padding-left:26px;color:var(--ink-soft);font-size:.95rem}
.tick-list li::before{
  content:"";position:absolute;left:0;top:.5em;width:12px;height:2px;background:var(--copper);
}

/* ============================================================
   MEDIA / PLACEHOLDERS SEO
   ============================================================ */
.media-figure{margin:0}
.media-figure img{width:100%;border-radius:var(--radius-sm);border:1px solid var(--line);object-fit:cover}
.media-figure figcaption{font-size:.78rem;color:var(--muted);margin-top:8px}
.media-placeholder{
  position:relative;width:100%;aspect-ratio:3/2;border-radius:var(--radius-sm);
  border:1px dashed var(--line-strong);
  background:
    linear-gradient(135deg,var(--surface-2) 0%,var(--surface) 55%,var(--surface-2) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:22px;text-align:center;overflow:hidden;
}
.media-placeholder::before{
  content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:7px;pointer-events:none;
}
.media-placeholder .ph-mark{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--copper);
  display:grid;place-items:center;font-family:var(--font-display);color:var(--copper);font-size:.95rem;
}
.media-placeholder .ph-label{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.media-placeholder .ph-seo{font-size:.78rem;color:var(--muted);max-width:42ch;line-height:1.5}

/* ============================================================
   PROYECTOS
   ============================================================ */
.project-card .project-cat{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.project-card .media-figure,.project-card .media-placeholder{margin-bottom:4px}
.project-card .project-actions{margin-top:auto;padding-top:10px}

/* ============================================================
   MODELOS DE COLABORACIÓN
   ============================================================ */
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:880px){.model-grid{grid-template-columns:1fr}}
.model-card{padding:32px}
.model-card .model-tag{
  align-self:flex-start;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--copper-deep);background:var(--gold-soft);padding:5px 13px;border-radius:999px;
}
.model-card h3{font-size:1.45rem}
.model-card .model-foot{margin-top:auto;padding-top:18px}

/* badges de industrias / clasificación */
.pill-cloud{display:flex;flex-wrap:wrap;gap:9px}
.pill{
  padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:.84rem;font-weight:500;color:var(--ink-soft);
  transition:border-color .2s,color .2s;
}
.pill:hover{border-color:var(--gold);color:var(--copper-deep)}
.pill-accent{border-color:color-mix(in srgb,var(--copper) 45%,transparent);color:var(--copper-deep);background:var(--gold-soft)}

/* ============================================================
   RECURSOS / DOCUMENTOS
   ============================================================ */
.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:980px){.resource-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.resource-grid{grid-template-columns:1fr}}
.resource-card{gap:8px;padding:22px}
.resource-card .r-icon{
  width:40px;height:40px;border-radius:11px;background:var(--gold-soft);
  display:grid;place-items:center;font-size:1.05rem;color:var(--copper-deep);
}
.resource-card h3{font-size:1.02rem;font-family:var(--font-body);font-weight:600}
.resource-card p{font-size:.85rem}
.resource-card .r-cta{margin-top:auto;padding-top:8px;font-size:.86rem;font-weight:600;color:var(--copper-deep);display:inline-flex;gap:6px;align-items:center}

/* ============================================================
   CLASIFICACIÓN IA
   ============================================================ */
.ai-section{background:var(--surface-2);border-radius:var(--radius);padding:42px;border:1px solid var(--line)}
@media(max-width:640px){.ai-section{padding:26px 20px}}
.ai-section .ai-lede{max-width:70ch;color:var(--ink-soft);margin:14px 0 26px}
.ai-sub{font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.ai-machine{margin-top:30px;border-top:1px solid var(--line-strong);padding-top:18px}
.ai-machine summary{
  cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
  list-style:none;display:inline-flex;align-items:center;gap:8px;
}
.ai-machine summary::-webkit-details-marker{display:none}
.ai-machine summary::after{content:"+";font-size:1rem;color:var(--copper)}
.ai-machine[open] summary::after{content:"–"}
.ai-machine .ai-data{margin-top:14px;font-size:.8rem;color:var(--muted);line-height:1.8}
.ai-machine .ai-data dt{font-weight:600;color:var(--ink-soft);margin-top:10px}
.ai-machine .ai-data dd{margin:0}

/* ============================================================
   FORMULARIO MULTIPASO (WIZARD)
   ============================================================ */
.wizard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);max-width:780px;margin:0 auto;overflow:hidden;
}
.wizard-head{padding:26px 30px 0}
.wizard-progress{display:flex;align-items:center;gap:14px}
.wizard-progress .bar{flex:1;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.wizard-progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--gold));border-radius:999px;transition:width .35s ease}
.wizard-progress .step-label{font-size:.76rem;font-weight:600;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.wizard-body{padding:26px 30px 30px}
@media(max-width:600px){.wizard-head{padding:20px 18px 0}.wizard-body{padding:20px 18px 24px}}
.wizard-step h3{font-size:1.35rem;margin-bottom:6px}
.wizard-step .step-hint{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input[type="text"],.field input[type="email"],.field input[type="tel"],.field input[type="url"],
.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:.94rem;
  transition:border-color .2s,box-shadow .2s;
}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--copper);box-shadow:0 0 0 3px var(--gold-soft);
}
.field .err{display:none;font-size:.78rem;color:var(--danger);margin-top:5px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}

/* opciones tipo tarjeta (radio / checkbox) */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.opt-grid{grid-template-columns:1fr}}
.opt-grid.compact{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.opt-grid.compact{grid-template-columns:repeat(2,1fr)}}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{
  display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--line-strong);background:var(--bg);font-size:.88rem;font-weight:500;color:var(--ink-soft);
  transition:border-color .2s,background .2s,color .2s;min-height:48px;
}
.opt span::before{
  content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.opt.checkbox span::before{border-radius:5px}
.opt input:checked+span{border-color:var(--copper);background:var(--gold-soft);color:var(--copper-deep);font-weight:600}
.opt input:checked+span::before{border-color:var(--copper);background:var(--copper);box-shadow:inset 0 0 0 3px var(--surface)}
.opt input:focus-visible+span{outline:2px solid var(--copper);outline-offset:2px}

/* responsabilidades dinámicas */
.resp-item{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.resp-item .resp-num{
  flex:0 0 30px;height:46px;display:grid;place-items:center;
  font-family:var(--font-display);color:var(--gold);font-size:.9rem;
}
.resp-item textarea{min-height:46px;height:46px}
.resp-item .resp-del{
  flex:0 0 auto;width:34px;height:46px;border:none;background:transparent;color:var(--muted);font-size:1.1rem;border-radius:8px;
}
.resp-item .resp-del:hover{color:var(--danger);background:var(--surface-2)}

/* slider de compensación */
.range-wrap{margin:8px 0 4px}
.range-display{
  font-family:var(--font-display);font-size:clamp(1.2rem,3vw,1.6rem);font-weight:600;color:var(--copper-deep);
  margin-bottom:18px;
}
.dual-range{position:relative;height:34px}
.dual-range .track,.dual-range .track-fill{position:absolute;top:50%;transform:translateY(-50%);height:5px;border-radius:999px}
.dual-range .track{left:0;right:0;background:var(--surface-2);border:1px solid var(--line)}
.dual-range .track-fill{background:linear-gradient(90deg,var(--copper),var(--gold))}
.dual-range input[type="range"]{
  position:absolute;inset:0;width:100%;appearance:none;-webkit-appearance:none;background:none;pointer-events:none;height:34px;margin:0;
}
.dual-range input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;pointer-events:auto;
  width:22px;height:22px;border-radius:50%;background:var(--surface);
  border:2px solid var(--copper);box-shadow:var(--shadow-sm);cursor:grab;
}
.dual-range input[type="range"]::-moz-range-thumb{
  pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--surface);
  border:2px solid var(--copper);box-shadow:var(--shadow-sm);cursor:grab;
}
.range-scale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:6px}
.form-note{
  margin-top:18px;padding:13px 16px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:.8rem;color:var(--muted);font-style:italic;
}

/* navegación del wizard */
.wizard-nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.wizard-nav .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}

/* resumen */
.summary-box{
  background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  padding:18px;font-size:.84rem;white-space:pre-wrap;color:var(--ink-soft);
  max-height:300px;overflow:auto;margin-top:14px;line-height:1.7;
}
.copy-feedback{font-size:.8rem;color:var(--ok);font-weight:600;margin-left:8px;opacity:0;transition:opacity .25s}
.copy-feedback.show{opacity:1}

/* ============================================================
   CTA FINAL / FOOTER
   ============================================================ */
.cta-band{
  background:var(--ink);color:var(--bg);border-radius:var(--radius);
  padding:52px 44px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:26px;
}
[data-theme="dark"] .cta-band{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
.cta-band h2{max-width:18ch}
.cta-band p{opacity:.78;margin-top:10px;max-width:48ch}
.cta-band .btn-primary{background:var(--gold);border-color:var(--gold);color:#1A1408}
.cta-band .btn-primary:hover{background:var(--copper);border-color:var(--copper);color:#FFF8EC}
@media(max-width:640px){.cta-band{padding:34px 24px}}
.site-footer{border-top:1px solid var(--line);padding:42px 0 56px;margin-top:72px}
.footer-inner{display:flex;flex-wrap:wrap;justify-content:space-between;gap:22px;align-items:flex-start}
.footer-links{display:flex;flex-wrap:wrap;gap:6px 20px;list-style:none}
.footer-links a{font-size:.86rem;color:var(--ink-soft)}
.footer-links a:hover{color:var(--copper-deep)}
.footer-meta{font-size:.8rem;color:var(--muted);margin-top:10px}

/* ============================================================
   ANIMACIONES DE SCROLL
   ============================================================ */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
}

/* página renderizada */
#app{min-height:60vh}
.route-page{animation:routeIn .4s ease}
@keyframes routeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>

<script>
/* ==================================================================
   MOTOR DE LA APLICACIÓN
   ------------------------------------------------------------------
   Este script NO contiene contenido. Lee el JSON interno (#app-data)
   y lo interpreta: navegación, rutas, bloques, proyectos, imágenes,
   placeholders SEO, clasificación IA, formulario multipaso y JSON-LD.
   Para editar el sitio, edita únicamente el JSON.
   ================================================================== */
(function () {
  "use strict";

  /* ---------- Datos ---------- */
  const DATA = JSON.parse(document.getElementById("app-data").textContent);
  const SETTINGS = DATA.settings || {};
  const LINKS = DATA.links || {};

  function supportedLanguages() {
    return SETTINGS.availableLanguages || ["es", "en"];
  }
  function normalizeLanguageCode(value) {
    const raw = String(value || "").toLowerCase().replace("_", "-");
    const aliases = SETTINGS.languageAliases || {};
    if (aliases[raw]) return aliases[raw];
    const base = raw.split("-")[0];
    if (aliases[base]) return aliases[base];
    return base;
  }
  function getLanguageFromPath() {
    const first = location.pathname.split("/").filter(Boolean)[0];
    const normalized = normalizeLanguageCode(first);
    return supportedLanguages().includes(normalized) ? normalized : "";
  }
  function detectPreferredLanguage() {
    const supported = supportedLanguages();
    const saved = normalizeLanguageCode(localStorage.getItem("site-lang"));
    if (supported.includes(saved)) return saved;
    const browserLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    for (const lang of browserLangs) {
      const normalized = normalizeLanguageCode(lang);
      if (supported.includes(normalized)) return normalized;
    }
    return SETTINGS.defaultLanguage || "es";
  }
  function htmlLangCode(lang) {
    return (SETTINGS.languageHtmlCodes && SETTINGS.languageHtmlCodes[lang]) || lang;
  }
  function languagePath(lang) {
    return (SETTINGS.languagePaths && SETTINGS.languagePaths[lang]) || ("/" + lang + "/");
  }

  const state = {
    lang: getLanguageFromPath() || detectPreferredLanguage(),
    theme: SETTINGS.defaultTheme || "light"
  };

  /* ---------- Utilidades ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  /* t(): resuelve un texto bilingüe {es,en} según idioma activo */
  function t(obj) {
    if (obj == null) return "";
    if (typeof obj === "string") return obj;
    return obj[state.lang] || obj[SETTINGS.defaultLanguage] || obj.es || obj.en || Object.values(obj)[0] || "";
  }
  /* ui(): textos de interfaz desde DATA.languages */
  function ui(key) {
    const pack = (DATA.languages && (DATA.languages[state.lang] || DATA.languages[SETTINGS.defaultLanguage])) || {};
    return pack[key] || key;
  }
  /* getLocalizedFallback(): fallbacks globales (imágenes, botones) */
  function getLocalizedFallback(group, key, lang) {
    const l = lang || state.lang;
    const g = (DATA.fallbacks && DATA.fallbacks[group]) || {};
    if (group === "buttons") {
      const b = g[key] || {};
      return b[l] || b.es || b.en || "";
    }
    const langPack = g[l] || g.es || g.en || {};
    return langPack[key] || "";
  }
  function isVisible(obj) { return obj && obj.visible !== false; }
  function linkOf(item) {
    if (!item) return "#";
    if (item.linkRef && LINKS[item.linkRef]) return LINKS[item.linkRef];
    return item.href || "#";
  }
  function extAttrs(external) {
    return external ? ' target="_blank" rel="noopener noreferrer"' : "";
  }

  /* ==================================================================
     IMÁGENES Y PLACEHOLDERS SEO
     ================================================================== */
  /* getImageOrPlaceholder(): decide entre imagen real o placeholder */
  function getImageOrPlaceholder(media, contextTitle) {
    const hasSrc = media && typeof media.src === "string" && media.src.trim() !== "";
    return hasSrc ? "image" : "placeholder";
  }
  function placeholderHTML(media, contextTitle) {
    const ph = (media && media.placeholder) || {};
    if (ph.enabled === false) return "";
    const label = ph.label || ui("placeholderLabel");
    const seoText = ph.seoText || getLocalizedFallback("images", "defaultAlt");
    const title = (media && media.title) || contextTitle || getLocalizedFallback("images", "defaultTitle");
    return '<div class="media-placeholder" role="img" aria-label="' + esc(seoText) + '" title="' + esc(title) + '">' +
      '<span class="ph-mark" aria-hidden="true">JA</span>' +
      '<span class="ph-label">' + esc(label) + '</span>' +
      '<span class="ph-seo">' + esc(seoText) + '</span>' +
      "</div>";
  }
  /* renderMedia(): imagen con alt/title/lazy + fallback automático.
     Si la URL falla al cargar, onerror la reemplaza por el placeholder. */
  function renderMedia(media, contextTitle) {
    if (!media || media.visible === false) return "";
    if (getImageOrPlaceholder(media, contextTitle) === "placeholder") {
      return placeholderHTML(media, contextTitle);
    }
    const alt = media.alt || contextTitle || getLocalizedFallback("images", "defaultAlt");
    const title = media.title || contextTitle || getLocalizedFallback("images", "defaultTitle");
    const w = media.width ? ' width="' + esc(media.width) + '"' : "";
    const h = media.height ? ' height="' + esc(media.height) + '"' : "";
    const cap = media.caption ? "<figcaption>" + esc(media.caption) + "</figcaption>" : "";
    return '<figure class="media-figure">' +
      '<img src="' + esc(media.src) + '" alt="' + esc(alt) + '" title="' + esc(title) + '"' +
      w + h + ' loading="' + esc(media.loading || "lazy") + '" data-media-fallback="1">' +
      cap + "</figure>";
  }
  /* Reemplazo en caliente de imágenes rotas */
  function armMediaFallbacks(root) {
    root.querySelectorAll("img[data-media-fallback]").forEach(function (img) {
      img.addEventListener("error", function () {
        const fig = img.closest(".media-figure");
        const holder = document.createElement("div");
        holder.innerHTML = placeholderHTML({ placeholder: { enabled: true } }, img.getAttribute("alt"));
        if (fig && holder.firstChild) fig.replaceWith(holder.firstChild);
      }, { once: true });
    });

  function renderAIClassification() {
    const ai = DATA.aiClassification;
    if (!isVisible(ai)) return "";
    const titles = (ai.machineBlockTitles && (ai.machineBlockTitles[state.lang] || ai.machineBlockTitles.es)) || {};
    const badges = (t(ai.visibleBadges) || []).map(function (b) {
      return '<span class="pill pill-accent">' + esc(b) + "</span>";
    }).join("");
    const labels = ((ai.professionalLabels && (ai.professionalLabels[state.lang] || ai.professionalLabels.es)) || [])
      .map(function (l) { return '<span class="pill">' + esc(l) + "</span>"; }).join("");
    const industries = (ai.industries || []).map(function (i) { return '<span class="pill">' + esc(i) + "</span>"; }).join("");
    function dl(label, arr) {
      if (!arr || !arr.length) return "";
      return "<dt>" + esc(label) + "</dt><dd>" + esc(arr.join(" · ")) + "</dd>";
    }
    /* Bloque discreto pero indexable (sin display:none) para ATS / buscadores / agentes IA */
    const machine =
      '<details class="ai-machine"><summary>' + esc(titles.summary || "Structured profile data") + "</summary>" +
      '<dl class="ai-data">' +
      dl("Primary category", [ai.primaryCategory]) +
      dl("Secondary categories", ai.secondaryCategories) +
      dl(titles.labels || "Professional labels", (ai.professionalLabels && ai.professionalLabels.en) || []) +
      dl(titles.industries || "Industries", ai.industries) +
      dl(titles.capabilities || "Core capabilities", ai.coreCapabilities) +
      dl(titles.keywords || "Search intent keywords", ai.searchIntentKeywords) +
      dl(titles.ats || "ATS keywords", ai.atsKeywords) +
      dl(titles.idealFor || "Ideal for", ai.idealFor) +
      dl(titles.notLimitedTo || "Not limited to", ai.notLimitedTo) +
      "</dl></details>";
    injectJSONLD();
    return '<section class="section" id="ai-profile-classification" aria-label="AI profile classification"><div class="container">' +
      '<div class="ai-section reveal">' +
      '<p class="eyebrow">' + esc(t(ai.sectionEyebrow)) + "</p>" +
      "<h2>" + esc(t(ai.sectionTitle)) + "</h2>" +
      '<p class="ai-lede">' + esc(t(ai.sectionText)) + "</p>" +
      '<div class="pill-cloud">' + badges + "</div>" +
      '<p class="ai-sub">' + esc(titles.labels || "Professional labels") + "</p>" +
      '<div class="pill-cloud">' + labels + "</div>" +
      '<p class="ai-sub">' + esc(titles.industries || "Industries") + "</p>" +
      '<div class="pill-cloud">' + industries + "</div>" +
      machine +
      "</div></div></section>";
  }

  /* JSON-LD dinámico desde el JSON interno (Person + ProfessionalService + ProfilePage) */
  function injectJSONLD() {
    if (!DATA.jsonld) return;
    let el = document.getElementById("dynamic-jsonld");
    if (!el) {
      el = document.createElement("script");
      el.type = "application/ld+json";
      el.id = "dynamic-jsonld";
      document.head.appendChild(el);
    }
    const ai = DATA.aiClassification || {};
    const person = Object.assign({}, DATA.jsonld.person);
    if (ai.professionalLabels && ai.professionalLabels.en) {
      person.disambiguatingDescription = ai.primaryCategory;
    }
    const graph = {
      "@context": "https://schema.org",
      "@graph": [
        person,
        DATA.jsonld.service,
        { "@type": "ProfilePage", "mainEntity": { "@id": person.url }, "about": ai.primaryCategory || "" }
      ]
    };
    el.textContent = JSON.stringify(graph);
  }

  const TOTAL_STEPS = 7;

    industries: [],

  function rangeText() {
    return form.comp.currency + " " + fmtMoney(form.comp.min) + " – " + form.comp.currency + " " + fmtMoney(form.comp.max);

  function wizardField(f, value, prefix) {
    const req = f.required ? " *" : "";
    if (f.type === "textarea") {
      return '<div class="field"><label for="' + prefix + f.id + '">' + esc(t(f.label)) + req + "</label>" +
        '<textarea id="' + prefix + f.id + '" data-bind="' + prefix + f.id + '">' + esc(value || "") + "</textarea>" +
        '<p class="err">' + esc(ui("requiredField")) + "</p></div>";
    }
    return '<div class="field"><label for="' + prefix + f.id + '">' + esc(t(f.label)) + req + "</label>" +
      '<input type="' + esc(f.type || "text") + '" id="' + prefix + f.id + '" data-bind="' + prefix + f.id + '" value="' + esc(value || "") + '"' +
      (f.required ? ' required aria-required="true"' : "") + ">" +
      '<p class="err">' + esc(f.type === "email" ? ui("invalidEmail") : ui("requiredField")) + "</p></div>";
  }

        '<div class="dual-range">' +
        '<div class="track"></div><div class="track-fill" id="track-fill"></div>' +
        '<input type="range" id="range-min" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + form.comp.min + '" aria-label="Mínimo">' +
        '<input type="range" id="range-max" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + form.comp.max + '" aria-label="Máximo">' +
        "</div>" +
        '<div class="range-scale"><span>' + form.comp.currency + " " + fmtMoney(s.min) + "</span><span>" + form.comp.currency + " " + fmtMoney(s.max) + "</span></div>" +
        "</div>" +
        '<p class="form-note">' + esc(t(s.note)) + "</p>";
    },
    7: function () {
      const s = F().steps.step7;
      const urg = (s.urgencyOptions[state.lang] || s.urgencyOptions.es).map(function (u, i) {
        const base = s.urgencyOptions.es[i];
        const checked = form.urgency === base ? " checked" : "";
        return '<label class="opt"><input type="radio" name="urgency" value="' + esc(base) + '"' + checked + "><span>" + esc(u) + "</span></label>";
      }).join("");
      return "<h3>" + esc(t(s.title)) + "</h3>" +
        '<div class="field"><label for="f-message">' + esc(t(s.messageLabel)) + '</label><textarea id="f-message" data-bind="message">' + esc(form.message) + "</textarea></div>" +
        '<div class="field"><label>' + esc(t(s.urgencyLabel)) + '</label><div class="opt-grid">' + urg + "</div></div>" +
        '<p class="ai-sub" style="margin-top:24px">' + esc(ui("summaryTitle")) + "</p>" +
        '<div class="summary-box" id="summary-box">' + esc(buildMessage()) + "</div>" +
        '<div style="margin-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:4px">' +
        '<button type="button" class="btn btn-outline btn-sm" id="copy-summary">' + esc(ui("copySummary")) + "</button>" +
        '<span class="copy-feedback" id="copy-feedback">' + esc(ui("copied")) + "</span></div>";
    }
  };

  /* ---------- Construcción del mensaje para WhatsApp / email ---------- */
  function labelOfOpportunity() {
    const s = F().steps.step1;
    const o = s.options.find(function (x) { return x.id === form.opportunity; });
    return o ? t(o.label) : "—";
  }
  function buildMessage() {
    const c = form.company, p = form.profile;
    const resp = form.responsibilities.map(function (r) { return r.trim(); }).filter(Boolean);
    const lines = [];
    lines.push(t(F().whatsappGreeting));
    lines.push("");
    lines.push("Tipo de oportunidad:");
    lines.push(labelOfOpportunity());
    lines.push("");
    lines.push("Empresa:");
    lines.push("- Nombre: " + (c.empresa || "—"));
    lines.push("- Web / red social: " + (c.sitio || "—"));
    lines.push("- País / ciudad: " + (c.pais || "—"));
    lines.push("- Contacto: " + (c.nombre || "—") + (c.cargo ? " (" + c.cargo + ")" : ""));
    lines.push("- Email: " + (c.email || "—"));
    lines.push("- WhatsApp: " + (c.whatsapp || "—"));
    lines.push("");
    lines.push("Área / industria:");
    lines.push(form.industries.length ? form.industries.join(", ") : "—");
    if (form.context.trim()) { lines.push("Contexto: " + form.context.trim()); }
    lines.push("");
    lines.push("Responsabilidades principales:");
    if (resp.length) { resp.forEach(function (r, i) { lines.push((i + 1) + ". " + r); }); }
    else { lines.push("—"); }
    lines.push("");
    lines.push("Perfil deseado:");
    lines.push("- Indispensables: " + (p.indispensables || "—"));
    lines.push("- Deseables: " + (p.deseables || "—"));
    lines.push("- Problema a resolver: " + (p.problema || "—"));
    lines.push("- Resultados 90 días: " + (p.resultados || "—"));
    lines.push("- Liderazgo de equipo: " + (p.liderazgo || "—"));
    lines.push("- Viajes: " + (p.viajes || "—"));
    lines.push("- Modalidad: " + (p.modalidad || "—"));
    lines.push("");
    lines.push("Rango de compensación:");
    lines.push(rangeText() + (form.comp.type ? " · " + form.comp.type : ""));
    lines.push("");
    lines.push("Urgencia: " + (form.urgency || "—"));
    lines.push("");
    lines.push("Mensaje adicional:");
    lines.push(form.message.trim() || "—");
    return lines.join("\n");
  }
  function sendWhatsApp() {
    const num = SETTINGS.whatsappNumber || "50765164741";
    window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(buildMessage()), "_blank", "noopener");
  }
  function sendEmail() {
    const to = LINKS.emailAddress || "josueth.acevedo@gmail.com";
    const subject = F().emailSubject || "Oportunidad profesional para Josueth Acevedo";
    window.location.href = "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(buildMessage());
  }

  /* ---------- Validación ---------- */
  function validateStep() {
    if (form.step === 1) {
      const ok = !!form.opportunity;
      const err = document.getElementById("step1-err");
      if (err) err.style.display = ok ? "none" : "block";
      return ok;
    }
    if (form.step === 2) {
      let ok = true;
      F().steps.step2.fields.forEach(function (f) {
        const el = document.getElementById("c_" + f.id);
        if (!el) return;
        const wrap = el.closest(".field");
        let valid = true;
        if (f.required && !el.value.trim()) valid = false;
        if (f.type === "email" && el.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim())) valid = false;
        if (f.type === "email" && f.required && !el.value.trim()) valid = false;
        wrap.classList.toggle("invalid", !valid);
        if (!valid) ok = false;
      });
      return ok;
    }
    return true;
  }

  /* ---------- Render del wizard ---------- */
  function renderWizard() {
    const body = document.getElementById("wiz-body");
    if (!body) return;
    const bar = document.getElementById("wiz-bar");
    const lbl = document.getElementById("wiz-step-label");
    const wrap = document.getElementById("wiz-bar-wrap");
    bar.style.width = (form.step / TOTAL_STEPS) * 100 + "%";
    wrap.setAttribute("aria-valuenow", form.step);
    lbl.textContent = ui("stepOf").replace("{a}", form.step).replace("{b}", TOTAL_STEPS);

    const last = form.step === TOTAL_STEPS;
    let nav = '<div class="wizard-nav">';
    nav += form.step > 1
      ? '<button type="button" class="btn btn-outline" id="wiz-back">← ' + esc(ui("back")) + "</button>"
      : "<span></span>";
    nav += '<div class="right">';
    if (last) {
      nav += '<button type="button" class="btn btn-outline" id="wiz-email">' + esc(ui("sendEmail")) + "</button>";
      nav += '<button type="button" class="btn btn-copper" id="wiz-wa">' + esc(ui("sendWhatsApp")) + "</button>";
    } else {
      nav += '<button type="button" class="btn btn-primary" id="wiz-next">' + esc(ui("next")) + " →</button>";
    }
    nav += "</div></div>";

    body.innerHTML = '<div class="wizard-step route-page">' + STEPS[form.step]() + "</div>" + nav;
    bindWizard(body);
  }

  function bindWizard(body) {
    /* data-bind genérico: inputs/textareas/selects → estado */
    body.querySelectorAll("[data-bind]").forEach(function (el) {
      el.addEventListener("input", function () {
        const key = el.getAttribute("data-bind");
        if (key.indexOf("c_") === 0) form.company[key.slice(2)] = el.value;
        else if (key.indexOf("p_") === 0) form.profile[key.slice(2)] = el.value;
        else form[key] = el.value;
        const sb = document.getElementById("summary-box");
        if (sb) sb.textContent = buildMessage();
      });
    });
    body.querySelectorAll('input[name="opportunity"]').forEach(function (r) {
      r.addEventListener("change", function () {
        form.opportunity = r.value;
        const err = document.getElementById("step1-err");
        if (err) err.style.display = "none";
      });
    });
    body.querySelectorAll('input[name="industry"]').forEach(function (cb) {
      cb.addEventListener("change", function () {
        const i = form.industries.indexOf(cb.value);
        if (cb.checked && i === -1) form.industries.push(cb.value);
        if (!cb.checked && i > -1) form.industries.splice(i, 1);
      });
    });
    body.querySelectorAll('input[name="urgency"]').forEach(function (r) {
      r.addEventListener("change", function () {
        form.urgency = r.value;
        const sb = document.getElementById("summary-box");
        if (sb) sb.textContent = buildMessage();
      });
    });
    /* responsabilidades dinámicas */
    body.querySelectorAll(".resp-input").forEach(function (ta) {
      ta.addEventListener("input", function () {
        form.responsibilities[Number(ta.getAttribute("data-resp"))] = ta.value;
      });
    });
    body.querySelectorAll(".resp-del").forEach(function (btn) {
      btn.addEventListener("click", function () {
        form.responsibilities.splice(Number(btn.getAttribute("data-del")), 1);
        renderWizard();
      });
    });
    const addResp = body.querySelector("#add-resp");
    if (addResp) addResp.addEventListener("click", function () {
      form.responsibilities.push("");
      renderWizard();
      const inputs = document.querySelectorAll(".resp-input");
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    /* slider doble */
    const rMin = body.querySelector("#range-min");
    const rMax = body.querySelector("#range-max");
    if (rMin && rMax) {
      const fill = body.querySelector("#track-fill");
      const out = body.querySelector("#range-out");
      const cfg = F().steps.step6;
      function paint() {
        const lo = ((form.comp.min - cfg.min) / (cfg.max - cfg.min)) * 100;
        const hi = ((form.comp.max - cfg.min) / (cfg.max - cfg.min)) * 100;
        fill.style.left = lo + "%";
        fill.style.right = (100 - hi) + "%";
        out.textContent = rangeText();
      }
      rMin.addEventListener("input", function () {
        form.comp.min = Math.min(Number(rMin.value), form.comp.max - cfg.step);
        rMin.value = form.comp.min;
        paint();
      });
      rMax.addEventListener("input", function () {
        form.comp.max = Math.max(Number(rMax.value), form.comp.min + cfg.step);
        rMax.value = form.comp.max;
        paint();
      });
      paint();
    }
    const curSel = body.querySelector("#f-currency");
    if (curSel) curSel.addEventListener("change", function () {
      form.comp.currency = curSel.value;
      renderWizard();
    });
    const typeSel = body.querySelector("#f-comptype");
    if (typeSel) typeSel.addEventListener("change", function () { form.comp.type = typeSel.value; });
    /* navegación */
    const next = body.querySelector("#wiz-next");
    if (next) next.addEventListener("click", function () {
      if (!validateStep()) return;
      form.step = Math.min(TOTAL_STEPS, form.step + 1);
      renderWizard();
      document.getElementById("wizard").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    const back = body.querySelector("#wiz-back");
    if (back) back.addEventListener("click", function () {
      form.step = Math.max(1, form.step - 1);
      renderWizard();
    });
    const wa = body.querySelector("#wiz-wa");
    if (wa) wa.addEventListener("click", sendWhatsApp);
    const em = body.querySelector("#wiz-email");
    if (em) em.addEventListener("click", sendEmail);
    const copyBtn = body.querySelector("#copy-summary");
    if (copyBtn) copyBtn.addEventListener("click", function () {
      const text = buildMessage();
      function done() {
        const fb = document.getElementById("copy-feedback");
        if (fb) { fb.classList.add("show"); setTimeout(function () { fb.classList.remove("show"); }, 1800); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
      } else { fallbackCopy(text); done(); }
    });
    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) { /* sin soporte */ }
      document.body.removeChild(ta);
    }
  }

  /* ==================================================================
     ROUTER SPA (#/ruta?parametros)
     ================================================================== */
  function parseHash() {
    const raw = (location.hash || "#/inicio").replace(/^#/, "");
    const qIndex = raw.indexOf("?");
    const path = (qIndex > -1 ? raw.slice(0, qIndex) : raw) || "/inicio";
    const params = {};
    if (qIndex > -1) {
      raw.slice(qIndex + 1).split("&").forEach(function (pair) {
        const kv = pair.split("=");
        if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || "");
      });
    }
    return { path: path, params: params };
  }

  function renderRoute() {
    const app = document.getElementById("app");
    const parsed = parseHash();
    const route = DATA.routes[parsed.path] || DATA.routes["/inicio"];
    /* preselección desde la URL: #/contacto?tipo=cartas|consultor|planilla */
    if (parsed.params.tipo) {
      const map = { cartas: "cartas", consultor: "consultor", planilla: "planilla", proyecto: "proyecto", alianza: "alianza", otro: "otro" };
      if (map[parsed.params.tipo]) { form.opportunity = map[parsed.params.tipo]; form.step = 1; }
    }
    const html = (route.blocks || []).map(function (name) {
      return BLOCKS[name] ? BLOCKS[name]() : "";
    }).join("");
    app.innerHTML = '<div class="route-page">' + html + "</div>";
    document.title = t(route.title) + " — Josueth Acevedo Cruz";
    armMediaFallbacks(app);
    observeReveals(app);
    if (document.getElementById("wizard")) renderWizard();
    updateNavCurrent(parsed.path);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    /* cerrar menú móvil al navegar */
    const nav = document.getElementById("main-nav");
    nav.classList.remove("open");
    document.getElementById("menu-toggle").setAttribute("aria-expanded", "false");
  }

  /* ==================================================================
     NAVEGACIÓN, IDIOMA, TEMA, FOOTER
     ================================================================== */
  function renderNav() {
    const list = document.getElementById("nav-list");
    list.innerHTML = (DATA.navigation || []).filter(isVisible).map(function (n) {
      return '<li><a href="#' + esc(n.path) + '" data-path="' + esc(n.path) + '">' + esc(t(n.label)) + "</a></li>";
    }).join("");
    const fl = document.getElementById("footer-links");
    fl.innerHTML = (DATA.navigation || []).filter(isVisible).map(function (n) {
      return '<li><a href="#' + esc(n.path) + '">' + esc(t(n.label)) + "</a></li>";
    }).join("") +
      '<li><a href="' + esc(LINKS.linkedin) + '" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>' +
      '<li><a href="' + esc(LINKS.pressArticle) + '" target="_blank" rel="noopener noreferrer">La Prensa</a></li>';
  }
  function updateNavCurrent(path) {
    document.querySelectorAll("#nav-list a").forEach(function (a) {
      if (a.getAttribute("data-path") === path) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }
  function renderChrome() {
    document.documentElement.lang = htmlLangCode(state.lang);
    document.documentElement.dir = (SETTINGS.rtlLanguages || []).includes(state.lang) ? "rtl" : "ltr";
    document.getElementById("brand-sub").textContent = ui("brandSub");
    document.getElementById("footer-tagline").textContent = ui("footerTagline");
    document.getElementById("footer-copy").textContent = "© " + new Date().getFullYear() + " Josueth Acevedo Cruz · " + ui("footerCopy");
    const langSelect = document.getElementById("lang-select");
    if (langSelect) {
      const labels = SETTINGS.languageLabels || {};
      const names = SETTINGS.languageNames || {};
      langSelect.innerHTML = supportedLanguages().map(function (code) {
        return '<option value="' + esc(code) + '"' + (code === state.lang ? " selected" : "") + ">" + esc(labels[code] || code.toUpperCase()) + "</option>";
      }).join("");
      langSelect.setAttribute("aria-label", ui("langLabel"));
      langSelect.title = names[state.lang] || state.lang.toUpperCase();
    }
    document.getElementById("theme-toggle").setAttribute("aria-label", ui("themeLabel"));
    document.getElementById("menu-toggle").setAttribute("aria-label", ui("menuOpen"));
  }
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("theme-toggle").textContent = state.theme === "light" ? "◐" : "◑";
  }

  /* ---------- Animaciones al hacer scroll ---------- */
  let observer = null;
  function observeReveals(root) {
    if (!("IntersectionObserver" in window)) {
      root.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
      return;
    }
    if (!observer) {
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add("in"); observer.unobserve(en.target); }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    }
    root.querySelectorAll(".reveal").forEach(function (el) { observer.observe(el); });
  }

  /* ==================================================================
     ARRANQUE
     ================================================================== */
  function boot() {
    applyTheme();
    renderChrome();
    renderNav();
    injectJSONLD();
    if (!location.hash) location.replace("#/inicio");
    renderRoute();

    window.addEventListener("hashchange", renderRoute);

    document.getElementById("menu-toggle").addEventListener("click", function () {
      const nav = document.getElementById("main-nav");
      const open = nav.classList.toggle("open");
      this.setAttribute("aria-expanded", String(open));
      this.setAttribute("aria-label", open ? ui("menuClose") : ui("menuOpen"));
    });
    document.getElementById("theme-toggle").addEventListener("click", function () {
      state.theme = state.theme === "light" ? "dark" : "light";
      applyTheme();
    });
    document.getElementById("lang-select").addEventListener("change", function () {
      const nextLang = this.value;
      const currentHash = location.hash || "#/inicio";
      localStorage.setItem("site-lang", nextLang);
      if (getLanguageFromPath()) {
        location.href = languagePath(nextLang) + currentHash;
        return;
      }
      state.lang = nextLang;
      renderChrome();
      renderNav();
      renderRoute();
      injectJSONLD();
    });
    /* navegación por teclado: Escape cierra el menú móvil */
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        document.getElementById("main-nav").classList.remove("open");
        document.getElementById("menu-toggle").setAttribute("aria-expanded", "false");
      }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
