<script>
(function(){
  var supported = ["es", "br", "en", "fr", "de", "ar", "zh", "ja"];
  var aliases = {"pt":"br","pt-br":"br","pt_BR":"br","zh-cn":"zh","zh-hans":"zh","zh-tw":"zh"};
  var paths = {"es": "/es/", "br": "/br/", "en": "/en/", "fr": "/fr/", "de": "/de/", "ar": "/ar/", "zh": "/zh/", "ja": "/ja/"};
  function normalize(value){
    var raw = String(value || "").toLowerCase().replace("_", "-");
    if (aliases[raw]) return aliases[raw];
    var base = raw.split("-")[0];
    return aliases[base] || base;
  }
  function pick(){
    try {
      var saved = normalize(localStorage.getItem("site-lang"));
      if (supported.indexOf(saved) > -1) return saved;
    } catch(e){}
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    for (var i=0; i<langs.length; i++) {
      var lang = normalize(langs[i]);
      if (supported.indexOf(lang) > -1) return lang;
    }
    return "es";
  }
  var target = pick();
  location.replace(paths[target] + (location.hash || ""));
})();
</script>
