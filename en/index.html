<script>
(function (l, h) {
  /* (a) Restaura la URL real tras el redirect del 404.html: /en/?/proyectos -> /en/proyectos */
  if (l.search[1] === '/') {
    var decoded = l.search.slice(1).split('&').map(function (s) {
      return s.replace(/~and~/g, '&');
    }).join('?');
    h.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    return;
  }
  /* (b) Puente para enlaces antiguos con hash: /en/#/proyectos -> /en/proyectos */
  if (l.hash.indexOf('#/') === 0) {
    var raw = l.hash.slice(1);                 // "/proyectos?tipo=x"
    var base = l.pathname.replace(/\/+$/, ''); // "/en"
    h.replaceState(null, null, base + (raw === '/inicio' ? '/' : raw));
  }
}(window.location, window.history));
</script>
